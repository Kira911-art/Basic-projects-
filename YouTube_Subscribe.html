<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube</title>
    <link rel="stylesheet" href="Yt_Subs_Final .css">
</head>
<style>
    body{
    font-family: Arial, Helvetica, sans-serif;
}
.yt_btn {
    background-color: black;
    color: white;
    border: none;
    padding-top: 10px;
    padding-bottom: 10px;
    padding-left: 15px;
    padding-right: 15px;
    border-radius: 50px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 35px;
}
.is-subscribed {
    background-color: rgb(240,240,240);
    color: black;
}
.costInput {
    padding-top: 10px;
    padding-bottom: 10px;
    padding-left: 10px;
    padding-right: 10px;
    font-size: 15px;
}
.Calc {
    background-color: green;
    color: white;
    border: none;
    padding-top: 12px;
    padding-bottom: 12px;
    padding-left: 15px;
    padding-right: 15px;
    font-size: 15px;
    cursor: pointer
}
</style>
<body>
    <p>YouTube Subscribe Button</p>
    <button onclick="
    subscribe();
    " class="yt_btn">Subscribe</button>
    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>
    <input placeholder="Cost of order" class="costInput"
    onkeydown = "
    Enter(event);
    ">
    <button onclick="
    calculateTotal()
    " class="Calc">Calculate</button>
    <p class="cost"></p>
</body>
<script>
    function Enter(event) {

        if(event.key === 'Enter'){
            calculateTotal();}
    }
    function calculateTotal(){
        const inputElement = document.querySelector('.costInput');
        let Cost = Number(inputElement.value);
        if (Cost < 40){
           Cost += 10;
        }
        
        document.querySelector('.cost').innerHTML = `$${Cost}`;
    }
    function subscribe(){
       const Subscribe = document.querySelector('.yt_btn');
       if(Subscribe.innerText === 'Subscribe'){
        Subscribe.innerHTML = 'Subscribed';
        Subscribe.classList.add('is-subscribed');
        }
        else {
            Subscribe.innerHTML = 'Subscribe';
            Subscribe.classList.remove('is-subscribed')
        }
    }
</script>
</html>
